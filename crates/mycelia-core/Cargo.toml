[package]
name = "mycelia-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
